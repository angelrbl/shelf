[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shelf"
version = "0.1.0"
description = "Book tracker."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy",
    "werkzeug",
    "python-dotenv",
    "pytest",
    "streamlit",
    "pandas",
    "plotly",
    "requests"
]

[tool.setuptools.packages.find]
where = ["."]